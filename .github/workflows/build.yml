name: Solar Cosmos Biscuit jar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Fix wrong Heightmap import
        run: |
          grep -rl 'net.minecraft.util.math.Heightmap' . --include=*.java | xargs -r sed -i 's/net\.minecraft\.util\.math\.Heightmap/net.minecraft.world.Heightmap/g'
      - name: Build
        run: |
          DIR=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -n 1)")
          echo "Project folder: $DIR"
          cd "$DIR"
          gradle build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: biscuit-orbital-jar
          path: out/*.jar
