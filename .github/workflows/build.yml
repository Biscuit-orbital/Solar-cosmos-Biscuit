name: build-mod
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build the mod
        run: |
          echo "=== files in repo ==="
          find . -maxdepth 3 -not -path './.git/*' | head -60
          FILE=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$FILE" ]; then echo "ERROR: settings.gradle not found - files were not uploaded"; exit 1; fi
          cd "$(dirname "$FILE")"
          echo "Building in: $(pwd)"
          gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: biscuit-orbital-jar
          path: '**/build/libs/*.jar'
